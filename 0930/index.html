<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Pokemon Card Generator</title>
</head>
<body>
    <div class="container">
        <p id="error" class="error">The Pokemon does not exist!</p>
        <div id="card">
            <p id="hp"></p>
            <img id="img" src="" alt="">
            <h2 id="name"></h2>
            <div id="types"></div>
            <div class="stats">
                <div>
                    <h3 id="attack"></h3>
                    <p>Attack</p>
                </div>
                <div>
                    <h3 id="defense"></h3>
                    <p>Defense</p>
                </div>
                <div>
                    <h3 id="speed"></h3>
                    <p>Speed</p>
                </div>
            </div>
        </div>
        <button id="btn">Generate</button>

        <div id="search">
            <p>Search by Pokemon name:</p>
            <input type="text" id="poke-name"/>
            <button id="btn2">Get</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
